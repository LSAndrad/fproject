<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}fproject{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">fproject</a>
    <nav>
      <a href="/import">Import</a>
      {% if current %}
        <a href="/review/{{ current }}">Review</a>
        <a href="/close/{{ current }}">Closing</a>
      {% endif %}
    </nav>
    {% if months %}
    <nav class="months">
      {% for m in months %}
        <a href="/close/{{ m }}" {% if m == current %}class="active"{% endif %}>{{ m }}</a>
      {% endfor %}
    </nav>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
