[project]
name = "fproject"
version = "0.1.0"
description = "Local-first personal finance: ingest bank statements, categorize spending, plan ahead."
readme = "README.md"
license = "MIT"
authors = [{ name = "Lucas Andrade" }]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
