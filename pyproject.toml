[project]
name = "fproject"
version = "0.1.0"
description = "Local-first personal finance: ingest bank statements, categorize spending, plan ahead."
readme = "README.md"
license = "MIT"
authors = [{ name = "Lucas Andrade" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.33",
    "uvicorn>=0.54.0",
]

[project.scripts]
fproject = "fproject.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
